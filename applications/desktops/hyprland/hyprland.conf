# ============================================================================
# HYPRLAND CONFIG - Omarchy on Void (Compatible with older Hyprland versions)
# ============================================================================

# Monitor configuration
monitor = ,preferred,auto,1
env = WAYLAND_DISPLAY,wayland-1
env = XDG_CURRENT_DESKTOP,Hyprland

# ============================================================================
# AUTOSTART
# ============================================================================

exec-once = /usr/bin/pipewire &
exec-once = /usr/bin/pipewire -c pipewire-pulse.conf &
exec-once = noctalia &
exec-once = swayidle -w before-sleep 'hyprlock' &
exec-once = mako &
exec-once = nm-applet --indicator &
exec-once = /usr/bin/octoxbps-notifier &
exec-once = /usr/libexec/hyprpolkitagent &
exec-once = swww init &
exec-once = swww img ~/.config/wallpapers/wallpaper.jpg &
exec-once = sleep 2 && QT_QPA_PLATFORMTHEME=qt6ct crystal-dock &

# Programs to autostart
exec-once = flameshot
exec-once = nym-vpn

# ============================================================================
# INPUT CONFIGURATION (Older Hyprland compatible)
# ============================================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# ============================================================================
# GENERAL
# ============================================================================

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = 0xff89b4fa
    col.inactive_border = 0xff45475a
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

# KEYBINDS
# ============================================================================

$mainMod = SUPER
$secondMod = ALT

# Terminal
bind = $mainMod, Return, exec, alacritty

# App Launcher
bind = $mainMod, D, exec, wofi --show drun
bind = $secondMod, SPACE, exec, wofi --show drun

# Close window
bind = $mainMod, Q, killactive,

# Fullscreen
bind = $mainMod, F, fullscreen, 1

# Toggle floating
bind = $mainMod, Space, togglefloating,

# Move focus with arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces (1-5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Volume control (if available)
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# Brightness control (if available)
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# Screenshot
bind = $mainMod, Print, exec, grimshot --notify save area
bind = $altMod CTRL SHIFT, 4, exec, grimshot --notify copy area
bind = $altMod SHIFT, 4, exec, grimshot --notify save area ~/Pictures/screenshot-$(date +%s).png
bind = $altMod, Print, exec, grimshot --notify save output

# Lock screen
bind = $mainMod CTRL, L, exec, swaylock -f

# Display shortcuts
# Shortcut help
bind = $mainMod, slash, exec, ~/.config/hypr/show-shortcuts.sh

windowrule = float on, center on, match:title ^(Hyprland Shortcuts)$

exec-once = ~/.config/hypr/show-shortcuts.sh
