# noctalia-greeter greeter.toml (declarative; Nix-safe; UI and Sync never write this)
# Last-used session lives in sync.toml; UI/Sync also fall back to sync.toml for scheme
# and output layout/transforms when not set here. Session power actions/menu entries are
# Sync-only (sync.toml [session.power]/[[session.actions]]) and are not settable here.
# [session] default, [user] default
# [appearance] scheme, password_style, hide_logo, power_buttons_position, scheme_selector_position, theme_mode, corner_radius_scale, font_family
# [appearance.palette] full color role table, [appearance.wallpaper] path/fill_mode/fill_color
# [appearance.wallpapers.<connector>] per-output wallpaper overrides
# [output] name/layout/scale/scales/width/height/transforms, [idle] timeout, [cursor] theme/size/path
# [keyboard] layout/variant/options/numlock
# [auth] allow_empty_password (bool), request_timeout (0-3600 seconds; default 60, 0 disables)

[appearance]
corner_radius_scale = 1.0
hide_logo = false
password_style = "random"
power_buttons_position = "bottom-right"
scheme_selector_position = "top-right"
theme_mode = "dark"

    [appearance.palette]
    error = "#FD4663"
    hover = "#9BFECE"
    on_error = "#0e0e43"
    on_hover = "#0e0e43"
    on_primary = "#0e0e43"
    on_secondary = "#0e0e43"
    on_surface = "#f3edf7"
    on_surface_variant = "#7c80b4"
    on_tertiary = "#0e0e43"
    outline = "#21215F"
    primary = "#fff59b"
    secondary = "#a9aefe"
    shadow = "#070722"
    surface = "#070722"
    surface_variant = "#11112d"
    tertiary = "#9BFECE"

    [appearance.wallpaper]
    fill_mode = "crop"
    path = "/usr/share/hypr/wall0.png"

[auth]
allow_empty_password = false
request_timeout = 60

[cursor]
path = "/usr/share/icons"
size = 24
theme = "Adwaita"

[idle]
timeout = 300

[keyboard]
layout = "us"
numlock = true

[session]
default = "hyrland"

[user]
default = "nezmahb"