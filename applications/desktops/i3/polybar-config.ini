[colors]
; macOS-style dark translucent theme
background = #1a1a1a
background-alt = #373B41
foreground = #ffffff
primary = #007aff
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/macos]
width = 100%
height = 24pt
radius = 10
background = ${colors.background}
foreground = ${colors.foreground}

font-0 = JetBrains Mono:size=10;2
font-1 = FontAwesome:size=10;2

line-size = 3pt
padding-left = 1
padding-right = 1

; This allows the bar to look like a floating pill
border-size = 4pt
border-color = #00000000

; Module placement
modules-left = launcher
modules-center = date
modules-right = tray filesystem pulseaudio cpu eth

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/launcher]
type = custom/text
; Replace the apple icon with a text character or a font-awesome icon
content = 
content-foreground = ${colors.primary}
click-left = rofi -show drun

[module/date]
type = internal/date
interval = 1
; Format: Day Month Date Time
date = %a %b %d %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/tray]
type = internal/xworkspaces
format-margin = 8px
tray-spacing = 8px
tray-size = 70%
; Note: The actual system tray (applets) is handled by the 'tray-position'
; setting in the [bar/macos] section, not as a module.

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%
